name: Veille technologique

on:
  schedule:
    # Chaque lundi à 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer le digest
        run: node veille/veille.mjs --site

      - name: Publier le digest
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add veille index.html
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "veille: digest du $(date +%F)"
            git push
          fi
